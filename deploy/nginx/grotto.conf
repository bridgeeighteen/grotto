# Grotto - Nginx + PHP-FPM production example.
#
# Install as /etc/nginx/sites-available/grotto.conf and symlink it into
# /etc/nginx/sites-enabled/. Replace example.com, /var/www/grotto, and the
# PHP-FPM socket path with your values.
#
# This file is included inside the http {} context, so upstream is valid here.

upstream grotto_php {
    server unix:/run/php/php8.3-fpm.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name grotto.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grotto.example.com;

    ssl_certificate     /etc/letsencrypt/live/grotto.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grotto.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    # Enable HSTS only after HTTPS works for every hostname you serve.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/grotto/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Keep these above the largest image/audio payload you accept. Match the
    # PHP post_max_size / upload_max_filesize values.
    client_max_body_size 32m;
    client_body_timeout 60s;

    # Never serve dotfiles. Keep .well-known available for ACME challenges.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Every request that is not a physical file goes through the front
    # controller. UI assets are served by UiController, not by a static alias.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only index.php may execute. This must be an exact match so that
    # router.php and any stray PHP file cannot be run in production.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO "";
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass grotto_php;
        fastcgi_connect_timeout 10s;
        # 480s covers 300s of async polling plus a 120s upstream request.
        fastcgi_read_timeout 480s;
        fastcgi_send_timeout 480s;
        # StreamProxy sends X-Accel-Buffering: no on SSE responses, so Nginx
        # disables buffering for those responses only. If another proxy strips
        # that header, create a dedicated location for the chat-completions
        # route and set fastcgi_buffering off there.
    }

    location ~ \.php$ {
        return 404;
    }

    # Compress JSON and UI assets. Do not add text/event-stream: SSE must pass
    # through without compression or buffering.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    access_log /var/log/nginx/grotto.access.log;
    error_log  /var/log/nginx/grotto.error.log warn;
}
