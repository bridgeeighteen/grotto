; Grotto - production PHP settings.
;
; Debian/Ubuntu: /etc/php/8.3/fpm/conf.d/99-grotto.ini
; RHEL family:   /etc/php.d/99-grotto.ini
;
; Reload PHP-FPM after changing this file. When opcache.validate_timestamps is
; 0, you must also reload PHP-FPM after every code deployment.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; Keep these aligned with client_max_body_size / LimitRequestBody.
memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 32M

; Must exceed GROTTO_ASYNC_TIMEOUT plus upstream and network overhead.
max_execution_time = 480
max_input_time = 60

; SSE must not be buffered or compressed by PHP.
output_buffering = Off
zlib.output_compression = Off
implicit_flush = Off

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M
