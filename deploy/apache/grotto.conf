# Grotto - Apache 2.4 + PHP-FPM production example.
#
# Debian/Ubuntu: /etc/apache2/sites-available/grotto.conf
# RHEL family:   /etc/httpd/conf.d/grotto.conf
#
# Enable the required modules first:
#   a2enmod rewrite headers proxy proxy_fcgi setenvif deflate ssl
#
# The example assumes the application is at /var/www/grotto and PHP-FPM listens
# on /run/php/php8.3-fpm.sock. Replace those values for your host.

<VirtualHost *:80>
    ServerName grotto.example.com
    Redirect permanent / https://grotto.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName grotto.example.com
    DocumentRoot /var/www/grotto/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/grotto.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/grotto.example.com/privkey.pem
    # SSLCertificateChainFile /etc/letsencrypt/live/grotto.example.com/chain.pem

    # Pass Authorization to PHP-FPM. CGIPassAuth requires Apache >= 2.4.13;
    # SetEnvIf is the compatibility fallback used by many FastCGI setups.
    CGIPassAuth On
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # Only the front controller may be executed by PHP.
    <FilesMatch "^(?!index\.php$).*\.php$">
        Require all denied
    </FilesMatch>

    # flushpackets=on makes SSE chunks leave Apache immediately instead of
    # waiting for the FastCGI buffer to fill.
    ProxyPassMatch ^/index\.php$ "unix:/run/php/php8.3-fpm.sock|fcgi://localhost/var/www/grotto/public/index.php" flushpackets=on
    # Covers 300s of async polling plus a 120s upstream request.
    ProxyTimeout 480

    <Directory /var/www/grotto/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        LimitRequestBody 33554432

        RewriteEngine On

        # Preserve Authorization for CGI/FastCGI on older FastCGI stacks.
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # Front controller: everything that is not a physical file or
        # directory goes to index.php.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # Never serve dotfiles.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Chat SSE must not be compressed by mod_deflate.
    SetEnvIf Request_URI "^/(bailian|modelscope|volcengine)/v1/chat/completions(\?|$)" no-gzip=1

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/json application/javascript text/css image/svg+xml text/plain
    </IfModule>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "same-origin"
        Header always set X-Frame-Options "DENY"

        # Enable HSTS only after HTTPS works for every hostname you serve.
        # Header always set Strict-Transport-Security "max-age=31536000"
    </IfModule>

    # Apache's default log format does not include Authorization headers.
    LogFormat "%a %l %u %t \"%r\" %>s %b %D" grotto
    CustomLog logs/grotto-access.log grotto
    ErrorLog logs/grotto-error.log
</VirtualHost>
